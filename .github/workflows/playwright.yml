name: DCS Playwright Tests

# Manual only: Actions tab → DCS Playwright Tests → Run workflow.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Playwright starts the mock DCS server itself (webServer in playwright.config.js).
      - name: Run Playwright tests
        run: npx playwright test

      - name: Build client report
        if: ${{ !cancelled() }}
        run: npm run report:client

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload client report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: client-report
          path: reports/DCS_QA_Report_*.html
          retention-days: 14

      - name: Upload failure traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results/
          retention-days: 14
